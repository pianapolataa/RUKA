retargeting:
  # "vector" is best for hands (matches finger direction/shape, ignores size differences)
  # "position" is strict XYZ matching (good if hand & robot are same size)
  type: vector 
  
  # Path to your URDF file
  urdf_path: "assets/robot.urdf" 
  
  target_origin_link_names:
    - "backhand"
    - "backhand"
    - "backhand"
    - "backhand"
    - "backhand"

  target_task_link_names:
    - "thumb_actual_tip"
    - "index_actual_tip"
    - "middle_actual_tip"
    - "ring_actual_tip"
    - "pinky_actual_tip"


  # MediaPipe indices
  target_link_human_indices:
    - [0, 0, 0, 0, 0]
    - [4, 8, 12, 16, 20]

    # If your robot hand is huge or tiny, you can add a scale factor (1.0 is default)
    # scaling_factor: 1.0